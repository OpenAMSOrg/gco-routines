# OPTIONAL, supervised only. Do not add these macros to print start/end.
# No commands execute at configuration load. Filament tests use ONLY bay 1/T1.

[gcode_macro GCO_TEST_FILAMENT]
description: Supervised bay 1 ONLY load-unload-load; caller prepares heat/homing
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}
        {action_raise_error('Inspect bay 1/T1 and path, then use CONFIRM=1')}
    {% endif %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Run standalone, never during an active print')}
    {% endif %}
    {% if printer.oams_manager.current_group not in [none, 'T1'] %}
        {action_raise_error('Only T1 is allowed; another bay is currently loaded')}
    {% endif %}
    # These existing macros enforce heat, homing, pause, and driver checks.
    # Never wrap this macro in START: T1 owns its own loading child.
    T1
    SAFE_UNLOAD_FILAMENT
    T1
    _GCO_TEST_FILAMENT_DONE

[gcode_macro _GCO_TEST_FILAMENT_DONE]
gcode:
    {% if printer.pause_resume.is_paused or printer.oams_manager.current_group != 'T1' %}
        {action_raise_error('T1 roundtrip did not finish; inspect before retrying')}
    {% endif %}
    RESPOND MSG="T1 roundtrip finished; verify physical feed and load/clean overlap"

[gcode_macro GCO_TEST_MOTION]
render_mode: ordered
description: Supervised small X out-and-back while a diagnostic child waits
gcode:
    {% set d = params.DISTANCE|default(10)|float %}
    {% set speed = params.SPEED|default(20)|float %}
    {% set th = printer.toolhead %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Run standalone, never during an active print')}
    {% endif %}
    {% if params.CONFIRM|default(0)|int != 1 or th.homed_axes != 'xyz' or printer.pause_resume.is_paused %}
        {action_raise_error('Inspect clearance, home, unpause, and use CONFIRM=1')}
    {% endif %}
    {% if not (1 <= d <= 10 and 5 <= speed <= 20) or th.position.z < 10 or th.position.x + d > th.axis_maximum.x - 5 or th.position.x < th.axis_minimum.x + 5 %}
        {action_raise_error('Motion test needs Z>=10 and clear X travel; distance 1..10, speed 5..20')}
    {% endif %}
    SAVE_GCODE_STATE NAME=gco_test_motion
    G91
    START NAME=motion_peer
        _GCO_TEST_PROBE LABEL=motion_peer MS=5000
    END
    G1 X{d} F{speed * 60}
    G1 X{-d} F{speed * 60}
    M400
    _GCO_TEST_PROBE LABEL=motion_done
    WAIT ON=motion_peer
    RESTORE_GCODE_STATE NAME=gco_test_motion MOVE=0

[gcode_macro GCO_TEST_HEATER]
render_mode: ordered
description: Supervised bounded warmup to 50C; no motion/extrusion
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Run standalone, never during an active print')}
    {% endif %}
    {% if params.CONFIRM|default(0)|int != 1 or printer.pause_resume.is_paused or printer.extruder.target != 0 or printer.extruder.temperature >= 40 %}
        {action_raise_error('Start cold (below 40C), target off, unpaused; use CONFIRM=1')}
    {% endif %}
    START NAME=warmup
        M109 S50
        _GCO_TEST_PROBE LABEL=heater_done
    END
    _GCO_TEST_PROBE LABEL=heater_peer MS=1000
    WAIT ON=warmup
    M104 S0
    _GCO_TEST_PROBE LABEL=PASS_heater
