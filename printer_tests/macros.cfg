# Optional diagnostics: load after [gco_routines], never in a START block.
# No startup actions, motion, heaters, or filament commands in this file.
[gco_routines_test]

[gcode_macro GCO_TEST_RESULTS]
render_mode: ordered
gcode:
    START NAME=alpha
        _GCO_TEST_PROBE LABEL=alpha MS=250 VALUE=11
        {% set result.value = reply.value %}
    END
    START NAME=beta
        _GCO_TEST_PROBE LABEL=beta MS=50 VALUE=22
        {% set result.value = reply.value %}
    END
    WAIT ON=beta,alpha
    {% if waited|length != 2 or waited[0].value != 22 or waited[1].value != 11 %}
        {action_raise_error('Explicit result order failed')}
    {% endif %}
    WAIT ON=alpha
    {% if waited[0].value != 11 %}
        {action_raise_error('Repeated result collection failed')}
    {% endif %}
    _GCO_TEST_PROBE LABEL=PASS_results

[gcode_macro GCO_TEST_BARE]
render_mode: ordered
gcode:
    START
        _GCO_TEST_PROBE LABEL=first MS=200 VALUE=31
        {% set result.value = reply.value %}
    END
    START
        _GCO_TEST_PROBE LABEL=second MS=30 VALUE=32
        {% set result.value = reply.value %}
    END
    _GCO_TEST_PROBE LABEL=late_wait MS=350
    WAIT
    {% if waited|length != 2 or waited[0].value != 31 or waited[1].value != 32 %}
        {action_raise_error('Bare WAIT must retain results in START order')}
    {% endif %}
    WAIT
    {% if waited|length != 0 %}
        {action_raise_error('Bare WAIT repeated already collected results')}
    {% endif %}
    _GCO_TEST_PROBE LABEL=PASS_bare

[gcode_macro GCO_TEST_WAITERS]
render_mode: ordered
gcode:
    START NAME=source
        _GCO_TEST_PROBE LABEL=source MS=250 VALUE=73
        {% set result.value = reply.value %}
    END
    START NAME=reader_a
        WAIT ON=source
        {% set result.value = waited[0].value %}
        _GCO_TEST_PROBE LABEL=reader_a VALUE={result.value}
    END
    START NAME=reader_b
        WAIT ON=source
        {% set result.value = waited[0].value %}
        _GCO_TEST_PROBE LABEL=reader_b VALUE={result.value}
    END
    WAIT ON=reader_b,reader_a,source
    {% if waited|map(attribute='value')|list != [73,73,73] %}
        {action_raise_error('Results were not retained for every waiter')}
    {% endif %}
    _GCO_TEST_PROBE LABEL=PASS_waiters

[gcode_macro GCO_TEST_REUSE]
render_mode: ordered
gcode:
    {% for n in range(3) %}
        START NAME=job
            _GCO_TEST_PROBE LABEL=reuse_{n} MS=20 VALUE={n}
            {% set result.value = reply.value %}
        END
        WAIT ON=job
        {% if waited[0].value != n %}
            {action_raise_error('Name reuse returned the wrong instance')}
        {% endif %}
    {% endfor %}
    _GCO_TEST_PROBE LABEL=PASS_reuse

[gcode_macro GCO_TEST_BARE_SNAPSHOT]
render_mode: ordered
gcode:
    START NAME=early
        _GCO_TEST_PROBE LABEL=early MS=80 VALUE=17
        {% set result.value = reply.value %}
    END
    START NAME=collector
        WAIT
        {% if waited|length != 1 or waited[0].value != 17 %}
            {action_raise_error('Child bare WAIT must exclude itself/default and bind a snapshot')}
        {% endif %}
        _GCO_TEST_PROBE LABEL=collector
    END
    _GCO_TEST_PROBE LABEL=let_bind MS=250
    START NAME=later
        _GCO_TEST_PROBE LABEL=later MS=20
    END
    WAIT ON=collector,later
    _GCO_TEST_PROBE LABEL=PASS_snapshot

[gcode_macro GCO_TEST_LOCALS]
render_mode: ordered
gcode:
    {% set data = namespace(value=params.VALUE|default(7)|int) %}
    START NAME=snapshot
        _GCO_TEST_PROBE LABEL=snapshot MS=30
        {% set result.value = data.value %}
        {% set data.value = 99 %}
    END
    {% set data.value = 8 %}
    WAIT ON=snapshot
    {% if waited[0].value != 7 or data.value != 8 %}
        {action_raise_error('START local snapshot/isolation failed')}
    {% endif %}
    {% if params.ENABLED|default(1)|int %}
        START NAME=live
            _GCO_TEST_PROBE LABEL=live VALUE=73
        END
        WAIT ON=live
        {% if printer.gco_routines_test.value != 73 %}
            {action_raise_error('Printer status was stale after WAIT')}
        {% endif %}
    {% endif %}
    _GCO_TEST_PROBE LABEL=PASS_locals

[gcode_macro _GCO_TEST_HELPER]
gcode:
    _GCO_TEST_PROBE LABEL={params.LABEL} MS=150 VALUE=91

[gcode_macro GCO_TEST_HELPERS]
render_mode: ordered
gcode:
    START NAME=helper_a
        _GCO_TEST_HELPER LABEL=helper_a
        {% set result.value = reply.value|default(-1) %}
    END
    START NAME=helper_b
        _GCO_TEST_HELPER LABEL=helper_b
        {% set result.value = reply.value|default(-1) %}
    END
    WAIT ON=helper_a,helper_b
    {% if waited[0].value != -1 or waited[1].value != -1 %}
        {action_raise_error('Helper leaked its last subcommand reply')}
    {% endif %}
    _GCO_TEST_PROBE LABEL=PASS_helpers

[gcode_macro GCO_TEST_MISSING_REPLY]
render_mode: ordered
gcode:
    START NAME=missing
        _GCO_TEST_PROBE LABEL=missing
        {% set result.value = reply.no_such_field %}
    END
    WAIT ON=missing
    _GCO_TEST_PROBE LABEL=FORBIDDEN

[gcode_macro GCO_TEST_GENERATED_CONTROL]
render_mode: ordered
gcode:
    WAIT
    {params.TEXT}
    _GCO_TEST_PROBE LABEL=FORBIDDEN
