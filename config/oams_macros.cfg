# OpenAMS single-FPS toolchange workflow for gco-routines.
#
# The cutter and toolhead-extruder preparation are completed before START.
# Only OAMS loading runs in the child routine, so it may safely overlap
# CLEAN_NOZZLE.  WAIT joins that transport before toolhead loading continues.
# When [gco_routines] is absent, the control lines are not rendered and the
# same operations execute serially on stock Klipper.  The continuation helpers
# give both paths fresh state at each safety decision.
# T0-T3 own the child through _OAMS_CONTINUE_AFTER_UNLOAD: invoke them from the
# default routine, not inside another START block (nested spawning is
# deliberately unsupported in v0.2).

[gcode_macro _oams_macro_variables]
# Cutter geometry for this printer.
variable_pre_cut_x: 57
variable_pre_cut_y: 350
variable_post_cut_x: 57
variable_post_cut_y: 350
variable_pre_cut_speed: 9000
variable_cut_x: 7
variable_cut_y: 350
variable_cut_speed: 1000

# Miro toolhead/extruder tuning.
variable_hotend_meltzone_compensation: 0.0
variable_retract_length: 20.0
variable_extrusion_reload_length: 28.0
variable_extrusion_unload_length: 32.0
# Matches the previously active 3000 mm/min * 3 seconds unload assist.
variable_extrusion_unload_additional_length: 150.0
variable_unload_speed: 1000
variable_additional_unload_speed: 3000
variable_reload_speed: 1000
# The printer's Klipper min_extrude_temp is intentionally only 10 C, so
# can_extrude becomes true near room temperature.  Enforce a material-safe
# workflow threshold independently of that low-level configuration guard.
variable_minimum_extrude_temperature: 170.0

# Optional toolhead filament switches.  These match the OpenAMS sample names.
# Leave disabled unless [filament_switch_sensor extruder_in] and/or
# [filament_switch_sensor extruder_out] are configured.
variable_fs_extruder_in: False
variable_fs_extruder_out: False
gcode:


[gcode_macro CHECK_FILAMENT]
description: Report the configured runout switch state
gcode:
    {% set filament_status = printer['filament_switch_sensor m4_left_runout'].filament_detected %}
    M117 Filament {filament_status}


[gcode_macro CUT_FILAMENT]
description: Cut filament and return to the cutter staging position
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error('Home the printer before cutting filament')}
    {% endif %}
    RESPOND TYPE=command MSG='Cutting filament'
    G90
    G0 X{v.pre_cut_x} Y{v.pre_cut_y} F{v.pre_cut_speed}
    G0 X{v.cut_x} Y{v.cut_y} F{v.cut_speed}
    G0 X{v.post_cut_x} Y{v.post_cut_y} F{v.pre_cut_speed}
    M400


[gcode_macro SAFE_UNLOAD_FILAMENT]
description: Cut, release the toolhead filament, and finish OAMS unloading
variable_pause_triggered: False
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% if printer.pause_resume.is_paused or not printer.extruder.can_extrude or printer.extruder.temperature < v.minimum_extrude_temperature or printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error('OpenAMS unload requires a homed, heated, unpaused printer')}
    {% endif %}
    {% if printer.oams_manager.current_group is none %}
        {action_raise_error('No OpenAMS filament group is loaded')}
    {% endif %}
    SAVE_GCODE_STATE NAME=oams_unload
    SET_GCODE_VARIABLE MACRO=SAFE_UNLOAD_FILAMENT VARIABLE=pause_triggered VALUE=False
    OAMSM_FOLLOWER ENABLE=1 DIRECTION=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
    M83
    G1 E-{v.retract_length} F{v.unload_speed}
    CUT_FILAMENT
    M83
    G1 E-{v.extrusion_unload_length} F{v.unload_speed}
    M400
    _UNLOAD_FS_OUT
    _OAMS_FINISH_UNLOAD


[gcode_macro _OAMS_FINISH_UNLOAD]
# A fresh helper render observes the preceding sensor check, including PAUSE.
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% if not printer["gcode_macro SAFE_UNLOAD_FILAMENT"].pause_triggered and not printer.pause_resume.is_paused %}
        G1 E-{v.extrusion_unload_additional_length} F{v.additional_unload_speed}
        G4 P1000
        OAMSM_UNLOAD_FILAMENT
        M400
        _OAMS_CONFIRM_UNLOADED
    {% else %}
        RESTORE_GCODE_STATE NAME=oams_unload
        _OAMS_ABORT MSG="OpenAMS unload stopped after the toolhead sensor check"
    {% endif %}


[gcode_macro _OAMS_CONFIRM_UNLOADED]
# This driver reports some errors as console messages. Check its actual state.
gcode:
    RESTORE_GCODE_STATE NAME=oams_unload
    {% if printer.oams_manager.current_group is not none or printer.pause_resume.is_paused %}
        _OAMS_ABORT MSG="OpenAMS did not finish unloading. Reload was not started"
    {% endif %}


[gcode_macro _OAMS_ABORT]
gcode:
    OAMSM_FOLLOWER ENABLE=0 DIRECTION=0
    PAUSE
    _OAMS_RAISE MSG="{params.MSG}"


[gcode_macro _OAMS_RAISE]
# Kept separate so the preceding recovery commands execute before raising.
gcode:
    {action_raise_error(params.MSG)}


[gcode_macro _UNLOAD_FS_OUT]
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% if v.fs_extruder_out and printer['filament_switch_sensor extruder_out'].filament_detected %}
        RESPOND TYPE=error MSG='Filament remains between the extruder and hotend after retraction. Check the cut and extrusion_unload_length. Pausing.'
        SET_GCODE_VARIABLE MACRO=SAFE_UNLOAD_FILAMENT VARIABLE=pause_triggered VALUE=True
        SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=True
    {% elif v.fs_extruder_out %}
        RESPOND TYPE=command MSG='Filament retracted past the extruder'
    {% endif %}


[gcode_macro _LOAD_FS_IN]
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% if v.fs_extruder_in and not printer['filament_switch_sensor extruder_in'].filament_detected %}
        RESPOND TYPE=error MSG='Filament was not detected at the toolhead inlet. Pausing.'
        SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=True
    {% elif v.fs_extruder_in %}
        RESPOND TYPE=command MSG='Filament detected at the toolhead inlet'
    {% endif %}


[gcode_macro _LOAD_FS_OUT]
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% if v.fs_extruder_out and not printer['filament_switch_sensor extruder_out'].filament_detected %}
        RESPOND TYPE=error MSG='Filament was not detected between the extruder and hotend. Pausing.'
        SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=True
    {% elif v.fs_extruder_out %}
        RESPOND TYPE=command MSG='Filament loaded through the extruder'
    {% endif %}


[gcode_macro _TX]
description: Change to an OpenAMS filament group using the single-FPS workflow
variable_pause_triggered: False
gcode:
    {% set GROUP = params.GROUP|upper %}
    {% set LOADED_GROUP = printer['oams_manager'].current_group %}
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% set RELOAD_LENGTH = v.extrusion_reload_length + v.retract_length + v.hotend_meltzone_compensation %}
    {% set HAS_GCO_ROUTINES = 'gco_routines' in printer.configfile.settings %}

    # Ignore Orca's spurious toolchange while it is excluding the current object.
    {% if printer.exclude_object.current_object not in printer.exclude_object.excluded_objects %}
        {% if LOADED_GROUP == GROUP %}
            RESPOND TYPE=command MSG='Toolhead already loaded with {GROUP}'
        {% else %}
            # Klipper preserves GROUP as the driver-facing value but normalizes
            # configfile.settings section keys to lowercase.
            {% if ('filament_group ' ~ GROUP|lower) not in printer.configfile.settings %}
                {action_raise_error('Unknown OpenAMS filament group ' ~ GROUP)}
            {% endif %}
            {% if printer.pause_resume.is_paused or not printer.extruder.can_extrude or printer.extruder.temperature < v.minimum_extrude_temperature or printer.toolhead.homed_axes != 'xyz' %}
                {action_raise_error('OpenAMS toolchange requires a homed, heated, unpaused printer')}
            {% endif %}
            RESPOND TYPE=command MSG='Switching {LOADED_GROUP|default("none", true)} -> {GROUP}'
            SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=False
            SET_GCODE_VARIABLE MACRO=SAFE_UNLOAD_FILAMENT VARIABLE=pause_triggered VALUE=False
            SAVE_GCODE_STATE NAME=oams_toolchange

            {% if LOADED_GROUP is not none %}
                SAFE_UNLOAD_FILAMENT
            {% endif %}
            {% if HAS_GCO_ROUTINES %}
                {% if not printer["gcode_macro _TX"].pause_triggered and not printer["gcode_macro SAFE_UNLOAD_FILAMENT"].pause_triggered and not printer.pause_resume.is_paused %}
                    # The child owns only OAMS transport.  The default routine
                    # may move the toolhead for cleaning without sharing those
                    # motors. Anonymous START permits repeated toolchanges.
                    START
                        OAMSM_LOAD_FILAMENT GROUP={GROUP}
                    END
                    CLEAN_NOZZLE
                    WAIT
                    _OAMS_CONTINUE_AFTER_LOAD GROUP={GROUP} RELOAD_LENGTH={RELOAD_LENGTH}
                {% else %}
                    _OAMS_FINISH_TOOLCHANGE
                {% endif %}
            {% else %}
                # Stock Klipper renders no control commands. This helper runs
                # after SAFE_UNLOAD_FILAMENT and rechecks its outcome.
                _OAMS_CONTINUE_AFTER_UNLOAD GROUP={GROUP} RELOAD_LENGTH={RELOAD_LENGTH}
            {% endif %}
        {% endif %}
    {% endif %}


[gcode_macro _OAMS_CONTINUE_AFTER_UNLOAD]
# Serial fallback rendered after unload completes on stock Klipper.
gcode:
    {% set GROUP = params.GROUP|upper %}
    {% set RELOAD_LENGTH = params.RELOAD_LENGTH|float %}
    {% if not printer["gcode_macro _TX"].pause_triggered and not printer["gcode_macro SAFE_UNLOAD_FILAMENT"].pause_triggered and not printer.pause_resume.is_paused %}
        OAMSM_LOAD_FILAMENT GROUP={GROUP}
        CLEAN_NOZZLE
        _OAMS_CONTINUE_AFTER_LOAD GROUP={GROUP} RELOAD_LENGTH={RELOAD_LENGTH}
    {% else %}
        _OAMS_FINISH_TOOLCHANGE
    {% endif %}


[gcode_macro _OAMS_CONTINUE_AFTER_LOAD]
# A separate render observes the completed load on both concurrent and serial
# Klipper installations.
gcode:
    {% set GROUP = params.GROUP|upper %}
    {% set RELOAD_LENGTH = params.RELOAD_LENGTH|float %}
    {% if printer.pause_resume.is_paused %}
        RESPOND TYPE=error MSG='OpenAMS toolchange stopped while the printer is paused'
        SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=True
        _OAMS_FINISH_TOOLCHANGE
    {% elif printer['oams_manager'].current_group != GROUP %}
        RESPOND TYPE=error MSG='OpenAMS did not load requested group {GROUP}. Pausing.'
        SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=True
        _OAMS_FINISH_TOOLCHANGE
    {% else %}
        _LOAD_FS_IN
        _OAMS_CONTINUE_AFTER_INLET RELOAD_LENGTH={RELOAD_LENGTH}
    {% endif %}


[gcode_macro _OAMS_CONTINUE_AFTER_INLET]
# A fresh render observes any pause requested by _LOAD_FS_IN.
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% set RELOAD_LENGTH = params.RELOAD_LENGTH|float %}
    {% if not printer["gcode_macro _TX"].pause_triggered and not printer.pause_resume.is_paused %}
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
        M83
        G1 E{RELOAD_LENGTH} F{v.reload_speed}
        M400
        G4 P1000
        _LOAD_FS_OUT
    {% endif %}
    _OAMS_FINISH_TOOLCHANGE


[gcode_macro _OAMS_FINISH_TOOLCHANGE]
# A fresh render observes the outlet check before deciding whether movement is
# safe during state restoration.
gcode:
    {% if not printer["gcode_macro _TX"].pause_triggered and not printer.pause_resume.is_paused %}
        RESTORE_GCODE_STATE NAME=oams_toolchange MOVE=1 MOVE_SPEED=100
    {% else %}
        # Restore modes without moving while paused or after a failed check.
        RESTORE_GCODE_STATE NAME=oams_toolchange
        _OAMS_ABORT MSG="OpenAMS toolchange failed. Inspect filament before retrying"
    {% endif %}


[gcode_macro T0]
gcode:
    _TX GROUP=T0

[gcode_macro T1]
gcode:
    _TX GROUP=T1

[gcode_macro T2]
gcode:
    _TX GROUP=T2

[gcode_macro T3]
gcode:
    _TX GROUP=T3


[gcode_macro OAMS_TOOLCHANGE_TORTURE_TEST]
description: Exercise the complete T0-T3 workflow; requires LOOPS
gcode:
    {% set loops = params.LOOPS|int %}
    {% for i in range(loops) %}
        T0
        T1
        T2
        T3
        RESPOND TYPE=command MSG='Completed OpenAMS toolchange loop {i + 1}'
    {% endfor %}


[gcode_macro OAMS_TORTURE_TEST]
description: Exercise raw OpenAMS bay load/unload; requires LOOPS
gcode:
    {% set loops = params.LOOPS|int %}
    {% for i in range(loops) %}
        {% for spool in range(4) %}
            OAMS_LOAD_SPOOL OAMS=1 SPOOL={spool}
            OAMS_UNLOAD_SPOOL OAMS=1
        {% endfor %}
        RESPOND TYPE=command MSG='Completed OpenAMS transport loop {i + 1}'
    {% endfor %}
