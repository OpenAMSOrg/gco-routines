# Sample Klipper configuration for gco-routines
#
# Include this section in your printer.cfg to enable START / END / WAIT
# background routine orchestration.

[gco_routines]

# Example macro utilizing ordered Jinja evaluation and gco-routines
[gcode_macro PREPARE_TOOL]
gcode:
    START NAME=filament_change
        T0
        {% set result.lane = reply.lane %}
        {% set result.loaded_mm = reply.loaded_mm %}
    END

    CLEAN_NOZZLE
    WAIT ON=filament_change

    {% set change = waited[0] %}
    M117 Loaded lane {change.lane}
